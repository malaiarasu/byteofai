title: Byte of AI
tagline: Ideas &amp; write-ups on applied AI
description: >-
  Ideas, publications, and projects from an AI native technologist —
  notes on applied AI, platform engineering, and building with AI-native tools.
author: Malai Arasu Paneerselvam
email: malaiarasu@gmail.com

# This site is served from the custom domain in CNAME (byteofai.dev), which
# sits at the domain root — so baseurl must stay empty. Only set a baseurl
# if you remove CNAME and fall back to https://<username>.github.io/byteofai.
url: "https://byteofai.dev"
baseurl: ""

github_username: malaiarasu
linkedin_url: "https://www.linkedin.com/in/malaiarasu-paneerselvam/"

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

plugins:
  - jekyll-feed
  - jekyll-seo-tag

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "default"

exclude:
  - README.md
  - templates/
  - Gemfile
  - Gemfile.lock
  - vendor/
  - node_modules/
  - wrangler.jsonc
